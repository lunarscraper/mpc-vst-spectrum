# Spectrum MPC skin layout. Tabs: SPECTRUM (31 third-octave bars, drawn as filmstrip meters by skin_post.py, plus
# TOP, RANGE, REACT and FREEZE) and SETUP (refresh rate, channel view, LSP's mode, tilt and FFT size).
# The bars stay left of x ~1000: MPC's Q-Link panel covers the right 255 px while a Q-Link is turned.
# The bars' area (x 64..964, y 128..578 in this file's coordinates) is left empty here; skin_post.py fills it.
style=td3
theme_bg=0c1012
theme_panel=0c1012
theme_line=000000
theme_ink=eef3f4
theme_ink_dim=9aa8ab
theme_ink_faint=4d5a5d
theme_accent=2ec4b6
theme_accent_hi=7fe7dc
theme_knob_face=222a2d
theme_knob_ring=000000
theme_knob_dot=2ec4b6
theme_bar=2ec4b6
theme_seg_active=2ec4b6
theme_seg_inactive=222a2d
theme_seg_active_tx=101416
theme_btn_text=eef3f4
theme_well=000000
theme_knob_off=3a4649
theme_tab_on=2ec4b6
theme_tab_on_tx=101416
theme_lcd=071413
theme_box=080b0c
theme_btn_bg=222a2d
theme_chrome_ink=eef3f4
theme_go_on=2ec4b6
theme_go_off=7fe7dc
theme_tabs=2ec4b6

[tab SPECTRUM]
frame x=36 y=88 w=958 h=624 title="SPECTRUM"
frame x=1004 y=88 w=239 h=624 title="DISPLAY"
knob cx=1123 cy=190 r=34 label="TOP" key=top
knob cx=1123 cy=345 r=34 label="RANGE" key=range
knob cx=1123 cy=500 r=34 label="REACT" key=react
toggle cx=1123 cy=640 label="FREEZE" key=freeze bw=160
qlinks "SPECTRUM" = top,range,react

[tab SETUP]
frame x=36 y=88 w=958 h=300 title="DISPLAY"
enum_h cx=270 cy=260 label="RATE" key=rate sw=105
enum_h cx=740 cy=260 label="VIEW" key=view sw=86
frame x=36 y=398 w=958 h=314 title="ANALYSIS (LSP)"
enum_h cx=170 cy=570 label="MODE" key=mode sw=120
enum_h cx=500 cy=570 label="TILT" key=tilt sw=75
enum_h cx=830 cy=570 label="FFT" key=fft sw=75
